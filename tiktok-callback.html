<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRL Lore Pipeline — TikTok sign-in</title>
<link rel="icon" href="avatar.png">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; background: #2a1f18; color: #efe3cc; }
  main { max-width: 560px; margin: 80px auto; padding: 24px; text-align: center; }
  .card { background: #ecdfc4; color: #191311; border: 4px solid #191311; border-radius: 18px; padding: 28px; }
  code { word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h2>IRL Lore Pipeline</h2>
    <p id="msg">Finishing TikTok sign-in…</p>
  </div>
</main>
<script>
  // TikTok sends the user back here. Pass the authorization result to the pipeline
  // running on the channel owner's own computer (localhost only). Nothing is stored here.
  const q = location.search;
  const p = new URLSearchParams(q);
  const msg = document.getElementById('msg');
  if (p.get('error')) {
    msg.textContent = 'Sign-in was cancelled or failed: ' + p.get('error');
  } else if (p.get('code')) {
    msg.textContent = 'Sign-in complete. Returning to the IRL Lore Pipeline app on this computer…';
    location.replace('http://localhost:8723/tiktok/callback' + q);
  } else {
    msg.textContent = 'This page is only used during TikTok sign-in for the IRL Lore Pipeline app.';
  }
</script>
</body>
</html>
